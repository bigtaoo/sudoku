# Checks every push and pull request; a push to main then deploys the web app to Cloudflare Workers
# and the API to the VPS in parallel. Secrets and VPS setup: README → 部署 → 自动部署.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Version from packageManager in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @sudoku/web build
      - run: pnpm --filter @sudoku/server build
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  deploy-web:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy-web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      # Only wrangler is needed here; the build comes from the check job.
      - run: pnpm install --frozen-lockfile --filter @sudoku/web
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: apps/web/dist
      - run: pnpm --filter @sudoku/web cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - run: curl -fsS -o /dev/null https://s.gamestao.com/

  deploy-api:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Queue rather than cancel: an interrupted compose up could leave the API half-replaced.
    concurrency: deploy-api
    steps:
      # The key can only run deploy/deploy.sh on the VPS, which pulls, rebuilds and waits for health.
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          HOST: ${{ secrets.VPS_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "root@$HOST" "$GITHUB_SHA"
      - run: curl -fsS --retry 5 --retry-delay 5 --retry-all-errors https://sudoku-api.gamestao.com/healthz
